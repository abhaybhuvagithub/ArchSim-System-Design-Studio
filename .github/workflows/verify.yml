# Every push must survive the full suite: build the real bundle, mount it in a
# real DOM, drive every tab, control, and contract. Green here is the claim
# "971 checks passed" made in public.
name: verify
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - run: node scripts/verify.mjs
