name: CI

# Runs on every pull request and on every branch except main, and is callable
# from other workflows (auto-merge reuses it rather than duplicating steps).
on:
  pull_request:
  push:
    # auto/** is excluded because auto-merge.yml calls this workflow itself;
    # without this it would run twice for every auto branch.
    branches-ignore: [main, 'auto/**']
  workflow_call:

jobs:
  verify:
    name: Build and verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify content and UI
        run: npm run verify

      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-report
          path: verify-report.txt
          if-no-files-found: ignore
          retention-days: 14
